name: Build MR KHORASANI Android APK

on:
  push:
    branches:
      - main
      - build/android-apk-pipeline
      - feature/excel-transfer-all-modules
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js for repository tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Run repository and Android packaging tests
        run: node --test tests/*.test.cjs

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists and is non-empty
        shell: bash
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create full-project, PWA and Zip-to-APK packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist /tmp/mrk-pwa /tmp/mrk-zip-to-apk
          cp index.html guest-runtime.js supabase-config.js supabase-client.js warehouse-migration.js mrk-data-tools.js mrk-export-store.js manifest.webmanifest sw.js icon.svg icon-192.png apple-touch-icon.png brand-mr.svg .nojekyll README-WEB-PWA-FA.txt WEB-GUEST-PRIVACY-FA.txt /tmp/mrk-pwa/
          cp /tmp/mrk-pwa/* /tmp/mrk-zip-to-apk/
          cat > /tmp/mrk-zip-to-apk/ZIP-TO-APK-SETUP-FA.txt <<'EOF'
          MR,KHORASANI 2.9.2 — ZIP TO APK
          این بسته مستقل وب‌اپ است و index.html در ریشه ZIP قرار دارد.
          همه فایل‌ها را در برنامه Zip to APK استخراج کنید و index.html را صفحه شروع قرار دهید.
          فایل‌های JS، پیکربندی Supabase، فونت/آیکون، manifest و service worker را حذف نکنید.
          برای نسخه نصب‌شدنی مستقل اندروید، از فایل APK ساخته‌شده در Artifact جداگانه استفاده کنید.
          EOF
          (cd /tmp/mrk-pwa && zip -qr "$GITHUB_WORKSPACE/dist/MR-KHORASANI-WEB-PWA-v2.9.2.zip" .)
          (cd /tmp/mrk-zip-to-apk && zip -qr "$GITHUB_WORKSPACE/dist/MR-KHORASANI-ZIP-TO-APK-v2.9.2.zip" .)
          zip -qr dist/MR-KHORASANI-FULL-PROJECT-v2.9.2.zip . \
            -x '.git/*' 'dist/*' 'android/.gradle/*' 'android/app/build/*' 'node_modules/*'
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/MR-KHORASANI-2.9.2-debug.apk
          unzip -t dist/MR-KHORASANI-WEB-PWA-v2.9.2.zip
          unzip -t dist/MR-KHORASANI-ZIP-TO-APK-v2.9.2.zip
          unzip -t dist/MR-KHORASANI-FULL-PROJECT-v2.9.2.zip
          test -s dist/MR-KHORASANI-2.9.2-debug.apk
          ls -lh dist/

      - name: Upload release ZIP packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MR-KHORASANI-2.9.2-Release-Packages
          path: |
            dist/MR-KHORASANI-WEB-PWA-v2.9.2.zip
            dist/MR-KHORASANI-ZIP-TO-APK-v2.9.2.zip
            dist/MR-KHORASANI-FULL-PROJECT-v2.9.2.zip
            dist/MR-KHORASANI-2.9.2-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MR-KHORASANI-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
