name: Build MR KHORASANI Android and guest browser packages

on:
  push:
    branches: [main, build/android-apk-pipeline, feature/excel-transfer-all-modules]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare independent browser and Android QR images
        run: |
          python3 -m pip install --quiet "qrcode[pil]" cairosvg
          python3 - <<'PY'
          import qrcode
          import cairosvg
          cairosvg.svg2png(url="icon.svg", write_to="icon-192.png", output_width=192, output_height=192)
          cairosvg.svg2png(url="icon.svg", write_to="icon-512.png", output_width=512, output_height=512)
          entries = {
              "guest-entry-qr.png": "https://aliakhtarian8888-crypto.github.io/MR-KHORASANI1/guest.html",
              "android-install-qr.png": "https://aliakhtarian8888-crypto.github.io/MR-KHORASANI1/downloads/MR-KHORASANI-2.9.6.apk",
          }
          for filename, url in entries.items():
              qr = qrcode.QRCode(error_correction=qrcode.constants.ERROR_CORRECT_H, box_size=12, border=4)
              qr.add_data(url); qr.make(fit=True)
              qr.make_image(fill_color="#071a35", back_color="white").convert("RGB").save(filename)
          PY
      - name: Run full test suite
        run: node --test tests/*.test.cjs
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'
      - name: Build native Android organization-user app
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Create two separate ZIP release targets
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p dist
          python3 scripts/package_release_targets.py --output dist --apk "$APK" --version 2.9.6
          cp "$APK" dist/MR-KHORASANI-2.9.6.apk
          zip -qr dist/MR-KHORASANI-FULL-PROJECT-v2.9.6.zip . \
            -x '.git/*' 'dist/*' 'android/.gradle/*' 'android/app/build/*' 'node_modules/*'
          unzip -t dist/MR-KHORASANI-GUEST-BROWSER-v2.9.6.zip
          unzip -t dist/MR-KHORASANI-ANDROID-INSTALL-v2.9.6.zip
          unzip -t dist/MR-KHORASANI-FULL-PROJECT-v2.9.6.zip
          ls -lh dist/
      - name: Upload two-entry release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MR-KHORASANI-2.9.6-Two-Entry-Release
          path: |
            dist/MR-KHORASANI-GUEST-BROWSER-v2.9.6.zip
            dist/MR-KHORASANI-ANDROID-INSTALL-v2.9.6.zip
            dist/MR-KHORASANI-2.9.6.apk
            dist/MR-KHORASANI-FULL-PROJECT-v2.9.6.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload standalone Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MR-KHORASANI-Android-2.9.6-APK
          path: dist/MR-KHORASANI-2.9.6.apk
          if-no-files-found: error
          retention-days: 14
      - name: Assemble GitHub Pages from the exact APK already packaged above
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE/downloads"
          cp index.html guest.html guest-runtime.js supabase-config.js supabase-client.js \
            warehouse-migration.js mrk-data-tools.js mrk-export-store.js \
            manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png \
            apple-touch-icon.png brand-mr.svg guest-entry-qr.png android-install-qr.png \
            android-install.html .nojekyll "$SITE/"
          cp dist/MR-KHORASANI-2.9.6.apk "$SITE/downloads/MR-KHORASANI-2.9.6.apk"
          test -s "$SITE/downloads/MR-KHORASANI-2.9.6.apk"
          cmp dist/MR-KHORASANI-2.9.6.apk "$SITE/downloads/MR-KHORASANI-2.9.6.apk"
          tar --dereference --hard-dereference --directory "$SITE" -cvf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy-pages:
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish Pages site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
