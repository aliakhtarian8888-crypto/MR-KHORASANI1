name: Deploy MR KHORASANI guest browser and Android download

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'
      - name: Generate independent QR codes
        run: |
          python3 -m pip install --quiet "qrcode[pil]"
          python3 - <<'PY'
          import qrcode
          entries = {
              "guest-entry-qr.png": "https://aliakhtarian8888-crypto.github.io/MR-KHORASANI1/?g=1",
              "android-install-qr.png": "https://aliakhtarian8888-crypto.github.io/MR-KHORASANI1/downloads/MR-KHORASANI-2.9.4.apk",
          }
          for filename, url in entries.items():
              qr = qrcode.QRCode(error_correction=qrcode.constants.ERROR_CORRECT_H, box_size=12, border=4)
              qr.add_data(url); qr.make(fit=True)
              qr.make_image(fill_color="#071a35", back_color="white").convert("RGB").save(filename)
          PY
      - name: Build current native Android APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Assemble browser website and Android download
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE/downloads"
          cp index.html guest-runtime.js supabase-config.js supabase-client.js \
            warehouse-migration.js mrk-data-tools.js mrk-export-store.js \
            manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png \
            apple-touch-icon.png brand-mr.svg guest-entry-qr.png android-install-qr.png \
            android-install.html .nojekyll "$SITE/"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$SITE/downloads/MR-KHORASANI-2.9.4.apk"
          test -s "$SITE/downloads/MR-KHORASANI-2.9.4.apk"
          tar --dereference --hard-dereference --directory "$SITE" -cvf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Publish Pages site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
