<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081A35">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="application-version" content="2.9.7-guest-key-fallback">
  <title>ورود مهمان | MR, KHORASANI</title>
  <style>
    :root{color-scheme:dark;font-family:Tahoma,Arial,sans-serif;background:#071326;color:#f4ead2}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 25%,#17345c,#071326 70%)}
    main{width:min(460px,100%);padding:30px 24px;border:1px solid #344968;border-top:4px solid #d6ad55;border-radius:22px;background:#0d203d;box-shadow:0 24px 60px #0005;text-align:center}
    .logo{width:76px;height:76px;margin:0 auto 18px;border:2px solid #d6ad55;border-radius:19px;display:grid;place-items:center;color:#f2d28c;font:700 27px Georgia,serif}
    h1{font-size:21px;margin:0 0 10px}
    p{color:#b4c0d2;line-height:2;font-size:13px}
    .status{margin:22px 0;padding:14px;border-radius:12px;background:#071a35;color:#f2d28c;line-height:1.9;font-size:13px;min-height:54px}
    button{width:100%;border:1px solid #d6ad55;border-radius:11px;background:#d6ad55;color:#081a35;padding:13px 18px;font:700 14px Tahoma,Arial,sans-serif;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    small{display:block;margin-top:16px;color:#8495ae;line-height:1.8}
  </style>
  <script src="./supabase-config.js?v=2.9.7" onerror="window.__MRK_SUPABASE_CONFIG_LOAD_FAILED=true"></script>
  <script>
  (function(){
    'use strict';
    const fallback={url:'https://klomsegarpfdkhkmoazy.supabase.co',publishableKey:'sb_publishable_bkwQJ96fqM2zd0yu0XQ6LA_QJl2c2RV'};
    const current=window.MRK_SUPABASE||{};
    window.MRK_SUPABASE={
      url:current.url||fallback.url,
      publishableKey:current.publishableKey||fallback.publishableKey
    };
  })();
  </script>
</head>
<body>
  <main>
    <div class="logo">MR</div>
    <h1>ورود مهمان MR, KHORASANI</h1>
    <p>با اسکن این QR یک نشست مهمان مستقل و کوتاه‌عمر ایجاد می‌شود. اطلاعات این نشست وارد دفاتر واقعی شرکت نمی‌شود.</p>
    <div class="status" id="status" role="status" aria-live="polite">در حال اتصال به سرویس امن ورود مهمان…</div>
    <button id="retry" type="button" hidden>تلاش مجدد</button>
    <small>این صفحه فقط ورود مهمان را آغاز می‌کند؛ برای کاربران سازمانی از اپلیکیشن اندروید و حساب اختصاصی استفاده کنید.</small>
  </main>
  <script>
  (function(){
    'use strict';
    const ENDPOINT=(window.MRK_SUPABASE?.url||'https://klomsegarpfdkhkmoazy.supabase.co').replace(/\\/+$/,'')+'/functions/v1/mrk-guest-demo';
    const status=document.getElementById('status');
    const retry=document.getElementById('retry');
    let running=false;
    function message(text,error){
      status.textContent=text;
      status.style.color=error?'#ff9b91':'#f2d28c';
      retry.hidden=!error;
      retry.disabled=false;
    }
    async function begin(){
      if(running)return;
      running=true;retry.disabled=true;retry.hidden=true;
      message('در حال ایجاد نشست امن مهمان…');
      try{
        const config=window.MRK_SUPABASE||{};
        if(!config.publishableKey)throw new Error('کلید عمومی اتصال سرویس در صفحه بارگذاری نشد.');
        if(!window.crypto||typeof crypto.getRandomValues!=='function')throw new Error('مرورگر تولید شناسه امن را پشتیبانی نمی‌کند.');
        const bytes=new Uint8Array(12);crypto.getRandomValues(bytes);
        const deviceId=Array.from(bytes,x=>x.toString(16).padStart(2,'0')).join('');
        const response=await fetch(ENDPOINT+'?api=issue',{
          method:'POST',cache:'no-store',
          headers:{'Content-Type':'application/json','apikey':config.publishableKey},
          body:JSON.stringify({action:'issue',device_id:deviceId})
        });
        const body=await response.json().catch(()=>({}));
        if(!response.ok||!body.token)throw new Error(body.error||('سرویس مهمان پاسخ معتبر نداد ('+response.status+').'));
        const token=String(body.token);
        if(token.length<32)throw new Error('توکن دریافتی معتبر نیست.');
        message('نشست ایجاد شد؛ در حال بازکردن برنامه…');
        const target=new URL('index.html',location.href);
        target.hash='guest_session='+encodeURIComponent(token);
        location.replace(target.href);
      }catch(error){
        message((error&&error.message)||'اتصال به سرویس ورود مهمان ناموفق بود. اینترنت را بررسی و دوباره تلاش کنید.',true);
        running=false;
      }
    }
    retry.addEventListener('click',begin);
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',begin,{once:true});
    else begin();
  })();
  </script>
</body>
</html>
